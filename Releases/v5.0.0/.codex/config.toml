# PAI Codex configuration.
#
# This file is installed as ~/.codex/config.toml. PAI's model-provider routing
# lives in PAI/TOOLS/Inference.ts and is configured via PAI_INFERENCE_BACKEND
# plus the PAI_INFERENCE_MODEL_* environment variables.

model = "gpt-5.4"
model_reasoning_effort = "high"

[tui]
# Codex currently supports a native, single-line persistent footer assembled
# from built-in item IDs. It does not support Claude-style command-backed or
# multiline status output in the live TUI, so PAI/statusline-command.sh is not
# wired here.
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "task-progress",
  "fast-mode",
]
status_line_use_colors = true

# Codex-native hook wiring. Keep lifecycle events in config.toml, not
# settings.json; Codex validates these event keys with --strict-config.
[[hooks.pre_tool_use]]
matcher = "Bash"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SecurityPipeline.hook.ts"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/ContextReduction.hook.sh"

[[hooks.pre_tool_use]]
matcher = "Write"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SecurityPipeline.hook.ts"

[[hooks.pre_tool_use]]
matcher = "Edit"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SecurityPipeline.hook.ts"

[[hooks.pre_tool_use]]
matcher = "MultiEdit"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SecurityPipeline.hook.ts"

[[hooks.pre_tool_use]]
matcher = "Read"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SecurityPipeline.hook.ts"

[[hooks.pre_tool_use]]
matcher = "AskUserQuestion"
[[hooks.pre_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SetQuestionTab.hook.ts"

[[hooks.post_tool_use]]
matcher = "WebFetch"
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/ContentScanner.hook.ts"
timeout = 5

[[hooks.post_tool_use]]
matcher = "WebSearch"
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/ContentScanner.hook.ts"
timeout = 5

[[hooks.post_tool_use]]
matcher = "AskUserQuestion"
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/QuestionAnswered.hook.ts"

[[hooks.post_tool_use]]
matcher = "Write"
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/TelosSummarySync.hook.ts"
timeout = 5
async = true

[[hooks.post_tool_use]]
matcher = "Edit"
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/TelosSummarySync.hook.ts"
timeout = 5
async = true

[[hooks.post_tool_use]]
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/ToolActivityTracker.hook.ts"
timeout = 5
async = true
[[hooks.post_tool_use.hooks]]
type = "command"
command = "$HOME/.codex/hooks/ContentScanner.hook.ts"
timeout = 5
async = true

[[hooks.pre_compact]]
matcher = "*"
[[hooks.pre_compact.hooks]]
type = "command"
command = "$HOME/.codex/hooks/PreCompact.hook.ts"

[[hooks.session_start]]
[[hooks.session_start.hooks]]
type = "command"
command = "$HOME/.codex/hooks/KittyEnvPersist.hook.ts"
[[hooks.session_start.hooks]]
type = "command"
command = "$HOME/.codex/hooks/LoadContext.hook.ts"
[[hooks.session_start.hooks]]
type = "command"
command = "$HOME/.codex/hooks/KVSync.hook.ts"
timeout = 10
async = true

[[hooks.user_prompt_submit]]
[[hooks.user_prompt_submit.hooks]]
type = "command"
command = "$HOME/.codex/hooks/PromptGuard.hook.ts"
timeout = 5

[[hooks.user_prompt_submit]]
[[hooks.user_prompt_submit.hooks]]
type = "command"
command = "$HOME/.codex/hooks/RepeatDetection.hook.ts"
timeout = 5

[[hooks.user_prompt_submit]]
[[hooks.user_prompt_submit.hooks]]
type = "command"
command = "$HOME/.codex/hooks/PromptProcessing.hook.ts"
timeout = 15
async = true

[[hooks.user_prompt_submit]]
[[hooks.user_prompt_submit.hooks]]
type = "command"
command = "$HOME/.codex/hooks/SatisfactionCapture.hook.ts"
timeout = 20
async = true
